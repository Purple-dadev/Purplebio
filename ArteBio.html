<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arte.lol</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<style>
  :root {
    --bg: #0c0811;
    --surface: #171023;
    --accent: #a855f7;
    --accent-2: #7c3aed;
    --txt: #f3eefc;
    --muted: #8b83a3;
    --border: rgba(168, 85, 247, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(600px 400px at 20% 10%, rgba(168, 85, 247, 0.18), transparent 60%),
      radial-gradient(700px 500px at 80% 90%, rgba(124, 58, 237, 0.22), transparent 60%),
      radial-gradient(500px 500px at 70% 20%, rgba(217, 70, 239, 0.10), transparent 60%);
  }

  .page {
    width: 100%;
    max-width: 560px;
    padding: 2.5rem 1.25rem 3rem;
    animation: fadeUp 0.6s ease both;
    perspective: 1200px;
  }

  .follow {
    will-change: transform;
    transform-style: preserve-3d;
  }

  .follow > * {
    transform: translateZ(30px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Topbar: username + counter ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .domain {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.4px;
    color: var(--txt);
    text-decoration: none;
  }

  .domain:hover { color: var(--accent); }

  .domain .glob {
    display: inline-flex;
    width: 26px;
    height: 26px;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-size: 15px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 6px 18px rgba(124,58,237,0.35);
  }

  .visits {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
  }

  .visits b { color: var(--txt); font-weight: 700; }

  /* ---------- Profile ---------- */
  .profile {
    text-align: center;
  }

  .pfp {
    width: 108px;
    height: 108px;
    margin: 0 auto 1.1rem;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    cursor: pointer;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px rgba(168,85,247,0.45), 0 12px 40px rgba(124,58,237,0.35);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
  }

  .pfp:hover { transform: rotate(-8deg) scale(1.08); }

  .pfp:active { transform: scale(0.95); }

  h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.3px; }

  .handle {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.3rem 0.75rem;
    margin-top: 0.4rem;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* ---------- Social icons row ---------- */
  .socials {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin: 1.25rem 0 1.6rem;
  }

  .soc {
    display: inline-flex;
    width: 42px;
    height: 42px;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--txt);
    text-decoration: none;
    font-size: 19px;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  .soc:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(168,85,247,0.28);
  }

  /* ---------- Bio ---------- */
  .bio {
    max-width: 460px;
    margin: 0 auto 1.8rem;
    padding: 1.15rem 1.3rem;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 0.98rem;
    line-height: 1.65;
    color: #dcd5ec;
    text-align: left;
  }

  .bio .clr { color: var(--accent); font-weight: 700; }

  /* ---------- Link buttons ---------- */
  .links { display: flex; flex-direction: column; gap: 0.8rem; }

  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    padding: 0.95rem 1.15rem;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--txt);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
  }

  .link:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    background: rgba(168,85,247,0.08);
  }

  .link .lt {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
  }

  .link .em {
    font-size: 1.25rem;
    line-height: 1;
  }

  .link .rt {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }

  .link-placeholder .lt {
    color: var(--muted);
    font-weight: 600;
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    margin-top: 2.4rem;
    font-size: 0.8rem;
    color: var(--muted);
    opacity: 0.8;
  }

  footer .dot { color: var(--accent); }
</style>
</head>
<body>
<div class="bg-glow"></div>

<main class="page">
  <div class="follow" id="follow">

  <div class="topbar">
    <a class="domain" href="#">
      <span class="glob">💜</span>
      arte.lol
    </a>
    <span class="visits">👁️ <b id="count">0</b> views</span>
  </div>

  <section class="profile">
    <div class="pfp" id="pfp" title="Placeholder">🐱</div>
    <h1>Artemis</h1>
    <div>
      <span class="handle">🛡️ @artemis</span>
    </div>

    <div class="socials">
      <a class="soc" href="#" title="Media control">⏯️</a>
    </div>
  </section>

  <div class="bio">
    <span class="clr">/bio</span> hey, I'm Artemis 💜 — 13, just vibing. this is a <span class="clr">placeholder</span> profile. links come soon, follow me or something idk 🔮
  </div>

  <nav class="links">
    <a class="link link-placeholder" href="#">
      <span class="lt">Link 1 (placeholder)</span>
      <span class="rt">soon</span>
    </a>
    <a class="link link-placeholder" href="#">
      <span class="lt">Link 2 (placeholder)</span>
      <span class="rt">soon</span>
    </a>
    <a class="link link-placeholder" href="#">
      <span class="lt">Link 3 (placeholder)</span>
      <span class="rt">soon</span>
    </a>
  </nav>

  <footer>
    <span class="dot">●</span> placeholder site — made with 💜 <span class="dot">●</span>
  </footer>
  </div>
</main>

<script>
  // Jiggle the placeholder avatar.
  const pfp = document.getElementById('pfp');

  pfp.addEventListener('click', () => {
    pfp.animate(
      [
        { transform: 'rotate(-12deg) scale(1.12)' },
        { transform: 'rotate(10deg) scale(1.05)' },
        { transform: 'rotate(-6deg) scale(1.1)' },
        { transform: 'rotate(0deg) scale(1)' }
      ],
      { duration: 500, easing: 'ease-in-out' }
    );
  });

  // Real view counter: persisted in localStorage, +1 per page load.
  const KEY = 'artebio_views';
  let views = parseInt(localStorage.getItem(KEY), 10);
  if (isNaN(views)) views = 0;
  views += 1;
  localStorage.setItem(KEY, views);
  document.getElementById('count').textContent = views.toLocaleString();

  // The whole card tilts toward the cursor in 3D.
  const follow = document.getElementById('follow');
  let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;

  window.addEventListener('pointermove', (e) => {
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = (e.clientY / window.innerHeight) * 2 - 1;
    targetRY = nx * 7;
    targetRX = -ny * 7;
  });

  function loop() {
    curRX += (targetRX - curRX) * 0.08;
    curRY += (targetRY - curRY) * 0.08;
    follow.style.transform =
      'translateY(-6px) rotateX(' + curRX.toFixed(2) + 'deg) rotateY(' +
      curRY.toFixed(2) + 'deg)';
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
